name: Bypass Cloudflare for Github Action
description: Temporarily bypass selected Cloudflare protections for this runner.
branding:
  icon: shield-off
  color: blue
inputs:
  cf_account_id:
    description: Cloudflare Account ID
    required: true
  cf_zone_id:
    description: Cloudflare Zone ID
    required: true
  cf_api_token:
    description: Cloudflare API Token
    required: true
  disable_bot_fight_mode:
    description: Temporarily disable zone-wide Bot Fight Mode (serialize jobs per zone)
    default: 'false'
  bfm_propagation_delay:
    description: Seconds to wait after disabling Bot Fight Mode
    default: '10'
  skip_bic:
    description: Also skip Browser Integrity Check for matching requests
    default: 'false'
  hostname:
    description: Optional exact hostname restricting the temporary skip rule
    default: ''
  path_prefix:
    description: Optional URL path prefix restricting the temporary skip rule
    default: ''
runs:
  using: node24
  main: src/main.js
  post: src/post.js
  post-if: always()
